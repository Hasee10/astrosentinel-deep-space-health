name: Verify

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
        working-directory: backend
      # -rs: show skip reasons in the CI log. test_source_documents_unchanged.py's
      # 4 tests always skip here (Mission_NASA_updated.docx, Mission_NASA(1).docx,
      # and vn.txt are untracked by design - see .gitignore) - -rs makes that an
      # explicit, visible line in CI output instead of a silently smaller pass count.
      - run: python -m pytest tests/ -q -rs
        working-directory: backend

  frontend:
    name: Frontend (data, tests, lint, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run check:data
        working-directory: frontend
      - run: npm test
        working-directory: frontend
      - run: npm run lint
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
